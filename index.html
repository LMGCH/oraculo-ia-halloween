<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Oráculo del Gordo 2026 🔮</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tarot-card">
        <!-- Pon esto justo debajo de <div class="tarot-card"> -->
        <div class="oracle-avatar">
            <!-- Opción A: Puedes usar una URL directa de una imagen tétrica ligera -->
            <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&auto=format&fit=crop&w=150" alt="Oráculo" class="oracle-img">
        </div>

        <h1>🔮 El Oráculo de Halloween</h1>
        <p class="subtitle">Deja que la Bruja IA invoque tu número del Gordo de Navidad 2026: Solo necesita tu nombre, tu fecha de nacimiento y tu color favorito</p>
        
        <form id="oracleForm">
            <input type="text" id="nombre" placeholder="Tu Primer Nombre (o Apodo)" required>
            <input type="date" id="fechaNacimiento" required>
            <input type="text" id="color" placeholder="Tu Color Favorito" required>
            
            <p class="lopd-text">🔒 No guardamos tus datos. La bruja solo los usa para el conjuro.</p>
            
            <button type="submit" id="btnInvocar">Invocar mi Suerte 🎃</button>
        </form>


        <div id="resultado" class="hidden">
            <div class="numero-suerte" id="numeroGordo">00000</div>
            <p id="prediccionTexto"></p>
            <!-- Pon esto debajo de <p id="prediccionTexto"></p> -->
            <button id="btnCompartir" class="btn-whatsapp">Compartir mi Suerte por WhatsApp 🟢</button>
            <!-- Pon esto en tu index.html, justo debajo del botón de WhatsApp -->
            <button id="btnLocalizar" class="btn-loterias">🔍 Buscar Dónde Comprar este Número</button>


        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
